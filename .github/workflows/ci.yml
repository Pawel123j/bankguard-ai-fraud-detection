name: BankGuard AI CI

# Wcześniej: branches: ["main"] — czyli CI NIE uruchamiało się na gałęziach
# roboczych i pierwszą informacją o błędzie był czerwony build na main.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint backend
        run: ruff check .
      - name: Audit backend dependencies
        run: |
          pip install 'pip-audit>=2.10.1,<3'
          pip-audit --progress-spinner off
      - name: Run tests
        # Aplikacja celowo odmawia startu bez sekretu podpisującego (patrz
        # app/security.py), więc testy też muszą go dostać. Wartość jest
        # jednorazowa i nie ma znaczenia poza tym przebiegiem.
        env:
          BANKGUARD_JWT_SECRET: ci-only-secret-not-for-production-${{ github.run_id }}
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Build frontend
        run: npm run build

  containers:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BANKGUARD_JWT_SECRET: isolated-compose-signing-key-for-ci-fixtures-only
      BANKGUARD_DEMO_PASSWORD: isolated-compose-password-for-ci-fixtures-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate and build images
        run: |
          docker compose config -q
          docker compose build
      - name: Seed persistent volume and start services
        run: |
          docker compose run --rm backend python seed.py
          docker compose up -d --wait --wait-timeout 120
      - name: Verify both published endpoints
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5173/ -o /tmp/bankguard-home.html
          test -s /tmp/bankguard-home.html
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable test stack
        if: always()
        run: docker compose down --volumes

