name: BankGuard AI CI

# Wcześniej: branches: ["main"] — czyli CI NIE uruchamiało się na gałęziach
# roboczych i pierwszą informacją o błędzie był czerwony build na main.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        # Aplikacja celowo odmawia startu bez sekretu podpisującego (patrz
        # app/security.py), więc testy też muszą go dostać. Wartość jest
        # jednorazowa i nie ma znaczenia poza tym przebiegiem.
        env:
          BANKGUARD_JWT_SECRET: ci-only-secret-${{ github.run_id }}
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build

