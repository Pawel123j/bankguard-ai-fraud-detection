name: BankGuard AI CI

# Gałęzie robocze testuje zdarzenie pull_request, więc błąd widać przed
# scaleniem. `push` na każdej gałęzi uruchamiał ten sam zestaw drugi raz
# (razem z budowaniem obrazów Dockera); teraz `push` obejmuje tylko main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nowy push do PR-a anuluje przebieg, który i tak jest już nieaktualny.
# Przebiegi na main nie są anulowane, żeby każdy commit miał pełny wynik.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint backend
        run: ruff check .
      - name: Audit backend dependencies
        run: |
          pip install 'pip-audit>=2.10.1,<3'
          pip-audit --progress-spinner off
      - name: Run tests
        # Aplikacja celowo odmawia startu bez sekretu podpisującego (patrz
        # app/security.py), więc testy też muszą go dostać. Wartość jest
        # jednorazowa i nie ma znaczenia poza tym przebiegiem.
        env:
          BANKGUARD_JWT_SECRET: ci-only-secret-not-for-production-${{ github.run_id }}
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Build frontend
        run: npm run build

  containers:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BANKGUARD_JWT_SECRET: isolated-compose-signing-key-for-ci-fixtures-only
      BANKGUARD_DEMO_PASSWORD: isolated-compose-password-for-ci-fixtures-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and build images
        run: |
          docker compose config -q
          docker compose build
      - name: Seed persistent volume and start services
        run: |
          docker compose run --rm backend python seed.py
          docker compose up -d --wait --wait-timeout 120
      - name: Verify both published endpoints
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:5173/ -o /tmp/bankguard-home.html
          test -s /tmp/bankguard-home.html
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable test stack
        if: always()
        run: docker compose down --volumes

