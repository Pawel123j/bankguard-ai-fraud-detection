[pytest]
# `pythonpath = .` sprawia, że pakiet `app` jest importowalny niezależnie od
# sposobu wywołania.
#
# Bez tego `python -m pytest` działa (dokłada bieżący katalog do sys.path),
# a gołe `pytest` — którego używa CI — kończy się
# ModuleNotFoundError: No module named 'app'. Dokładnie ta różnica przepuściła
# zielone testy lokalnie i wywróciła je w CI.
pythonpath = .
testpaths = tests
