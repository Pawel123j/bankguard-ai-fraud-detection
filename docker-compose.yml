services:
  backend:
    build: ./backend
    environment:
      BANKGUARD_JWT_SECRET: ${BANKGUARD_JWT_SECRET:?Set BANKGUARD_JWT_SECRET in .env before starting}
      BANKGUARD_DATABASE_URL: sqlite:////app/data/bankguard.db
      BANKGUARD_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      BANKGUARD_DEMO_EMAIL: ${BANKGUARD_DEMO_EMAIL:-analyst@bankguard.ai}
      BANKGUARD_DEMO_PASSWORD: ${BANKGUARD_DEMO_PASSWORD:?Set BANKGUARD_DEMO_PASSWORD in .env for the explicit demo seed}
    volumes:
      - bankguard-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bankguard-data:
